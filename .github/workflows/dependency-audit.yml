name: Dependency audit

on:
  schedule:
    # Every Monday 06:00 UTC - catches CVEs disclosed after a dependency was
    # last pinned, since pinning alone freezes the version, not the risk.
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  audit:
    name: pip-audit (scheduled)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Upgrade pip (patch known CVEs in the bundled interpreter)
        run: uv run python -m pip install --upgrade pip

      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit
