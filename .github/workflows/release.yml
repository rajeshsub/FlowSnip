name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # Gate: full test suite must pass before any build starts
  # ---------------------------------------------------------------------------
  test:
    uses: ./.github/workflows/test-suite.yml

  # ---------------------------------------------------------------------------
  # Extract version from pyproject.toml (used by all build jobs)
  # ---------------------------------------------------------------------------
  version:
    name: Extract version
    runs-on: ubuntu-latest
    needs: test
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: get_version
        run: |
          VERSION=$(python -c "import tomllib; d=tomllib.load(open('pyproject.toml','rb')); print(d['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Windows build → NSIS installer
  # ---------------------------------------------------------------------------
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies + PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_extracted
          New-Item -ItemType Directory -Force -Path ffmpeg_bin
          Copy-Item ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe ffmpeg_bin\
          Copy-Item ffmpeg_extracted\ffmpeg-master-latest-win64-gpl\bin\ffprobe.exe ffmpeg_bin\

      - name: Generate icon files
        run: uv run python installer/pre_build.py

      - name: Build with PyInstaller
        run: uv run pyinstaller installer/FlowSnip.spec

      # TODO: code signing — add Windows EV cert signing here before packaging
      # signtool sign /tr http://timestamp.sectigo.com /td sha256 /fd sha256
      #   /a dist\FlowSnip\FlowSnip.exe

      - name: Install NSIS
        run: choco install nsis -y

      - name: Build NSIS installer
        shell: pwsh
        run: |
          & "C:\Program Files (x86)\NSIS\makensis.exe" /DVERSION=${{ env.VERSION }} installer\windows\FlowSnip.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/FlowSnip-${{ env.VERSION }}-windows-setup.exe

  # ---------------------------------------------------------------------------
  # macOS arm64 build → DMG
  # ---------------------------------------------------------------------------
  build-macos-arm64:
    name: Build macOS arm64 DMG
    runs-on: macos-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
      ARCH: arm64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies + PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Download ffmpeg (macOS)
        run: |
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffmpeg/zip" -o ffmpeg.zip
          curl -L "https://evermeet.cx/ffmpeg/getrelease/ffprobe/zip" -o ffprobe.zip
          mkdir -p ffmpeg_bin
          unzip -o ffmpeg.zip -d ffmpeg_bin
          unzip -o ffprobe.zip -d ffmpeg_bin
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe

      - name: Generate icon files
        run: uv run python installer/pre_build.py

      - name: Build with PyInstaller
        run: uv run pyinstaller installer/FlowSnip.spec

      # TODO: code signing + notarization — add Apple Developer ID signing here
      # codesign --deep --force --sign "Developer ID Application: ..." dist/FlowSnip.app

      - name: Create DMG
        run: bash installer/macos/create_dmg.sh ${{ env.VERSION }} ${{ env.ARCH }}

      - uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-dmg
          path: dist/FlowSnip-${{ env.VERSION }}-macos-${{ env.ARCH }}.dmg

  # ---------------------------------------------------------------------------
  # Linux build → AppImage
  # ---------------------------------------------------------------------------
  build-linux:
    name: Build Linux AppImage
    runs-on: ubuntu-latest
    needs: version
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y libglib2.0-0 libgl1 libdbus-1-3 fuse \
            libx11-6 libxcb1 libxext6 libxrender1

      - name: Install uv
        run: pip install uv

      - name: Install dependencies + PyInstaller
        run: |
          uv sync
          uv pip install pyinstaller

      - name: Download ffmpeg (Linux)
        run: |
          wget -q "https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz" -O ffmpeg.tar.xz
          mkdir -p ffmpeg_bin
          tar -xf ffmpeg.tar.xz --strip-components=1 -C ffmpeg_bin --wildcards "*/ffmpeg" "*/ffprobe"
          chmod +x ffmpeg_bin/ffmpeg ffmpeg_bin/ffprobe

      - name: Generate icon files
        run: uv run python installer/pre_build.py

      - name: Build with PyInstaller
        run: uv run pyinstaller installer/FlowSnip.spec

      - name: Download appimagetool
        run: |
          wget -q "https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage" \
            -O appimagetool
          chmod +x appimagetool

      - name: Create AppDir structure
        run: |
          mkdir -p AppDir/usr/bin AppDir/usr/share/icons/hicolor/256x256/apps
          cp -r dist/FlowSnip/* AppDir/usr/bin/
          cp assets/icon.png AppDir/usr/share/icons/hicolor/256x256/apps/flowsnip.png
          cp assets/icon.png AppDir/flowsnip.png

          cat > AppDir/flowsnip.desktop << EOF
          [Desktop Entry]
          Name=FlowSnip
          Exec=FlowSnip
          Icon=flowsnip
          Type=Application
          Categories=Network;Video;AudioVideo;
          EOF

          cat > AppDir/AppRun << 'APPRUN'
          #!/bin/sh
          SELF=$(readlink -f "$0")
          HERE=${SELF%/*}
          export PATH="${HERE}/usr/bin:${PATH}"
          exec "${HERE}/usr/bin/FlowSnip" "$@"
          APPRUN
          chmod +x AppDir/AppRun

      - name: Build AppImage
        run: |
          ARCH=x86_64 ./appimagetool AppDir \
            "dist/FlowSnip-${{ env.VERSION }}-linux.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-appimage
          path: dist/FlowSnip-${{ env.VERSION }}-linux.AppImage

  # ---------------------------------------------------------------------------
  # Release: collect all artifacts and publish
  # ---------------------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [version, build-windows, build-macos-arm64, build-linux]
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: FlowSnip v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            release-artifacts/FlowSnip-${{ env.VERSION }}-windows-setup.exe
            release-artifacts/FlowSnip-${{ env.VERSION }}-macos-arm64.dmg
            release-artifacts/FlowSnip-${{ env.VERSION }}-linux.AppImage
