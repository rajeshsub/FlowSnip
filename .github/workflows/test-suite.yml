name: Test suite

on:
  workflow_call:

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check flowsnip/ tests/ && uv run ruff format --check flowsnip/ tests/

      - name: Type check (mypy)
        run: uv run mypy flowsnip/

      - name: Audit dependencies (pip-audit)
        run: uv run pip-audit

      - name: Run tests
        run: uv run pytest
