[project]
name = "flowsnip"
version = "0.1.0"
description = "FlowSnip - Download media from YouTube, Vimeo, TikTok, Facebook, Instagram, SoundCloud, Twitter, and Twitch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.3",
    "customtkinter>=5.2.2",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.11.0",
    "pillow>=12.0.0",
    "packaging>=25.0",
]

[project.scripts]
flowsnip = "flowsnip.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowsnip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=flowsnip --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["flowsnip"]
omit = ["flowsnip/test_ui.py"]
branch = false

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
