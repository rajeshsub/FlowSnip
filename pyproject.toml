[project]
name = "flowsnip"
version = "0.1.3"
description = "FlowSnip - Download media from YouTube, Vimeo, TikTok, Facebook, Instagram, SoundCloud, Twitter, and Twitch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yt-dlp>=2026.7.4",
    "customtkinter>=5.2.2",
    "pydantic>=2.12.3",
    "pydantic-settings>=2.14.2",
    "pillow>=12.3.0",
    "packaging>=25.0",
]

[project.scripts]
flowsnip = "flowsnip.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9.0",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pre-commit>=3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["flowsnip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-v --cov=flowsnip --cov-report=term-missing --cov-fail-under=100"

[tool.coverage.run]
source = ["flowsnip"]
omit = ["flowsnip/test_ui.py"]
branch = true

[tool.coverage.report]
fail_under = 100
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_ignores = false
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
ignore_missing_imports = true
exclude = ["(^|[\\\\/])tests[\\\\/]", "flowsnip/test_ui\\.py"]

[[tool.mypy.overrides]]
module = ["flowsnip.gui", "flowsnip.test_ui"]
disallow_untyped_defs = false
warn_return_any = false

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
